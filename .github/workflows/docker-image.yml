name: Docker Image CI

on:
  push:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag leonardosartorello/seguranca_docker:${{ github.run_number }}

    - name: Docker Scout
    # You may pin to the exact commit or the version.
    # uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864
      uses: docker/scout-action@v1.26.0
      with:
      # Command(s) to run.
  
        command: quickview
        
        image: leonardosartorello/seguranca_docker:${{ github.run_number }}
      
        ignore-base: false
        
        dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
        # Docker Hub PAT
        dockerhub-password: ${{ secrets.DOCKERHUB_PASS }}

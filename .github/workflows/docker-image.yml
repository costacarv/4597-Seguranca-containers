name: Docker Image CI

on:
  push:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag leonardosartorello/seguranca_docker:${{ github.run_number }}

    - name: Docker Scout
    # You may pin to the exact commit or the version.
    # uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864
      uses: docker/scout-action@v1.26.0
      with:
      # Command(s) to run.
  
        command: quickview
        
        image: leonardosartorello/seguranca_docker:${{ github.run_number }}
      
        ignore-base: false
        
        dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
        # Docker Hub PAT
        dockerhub-password: ${{ secrets.DOCKERHUB_PASS }}

    - name: Aqua Security Trivy
  # You may pin to the exact commit or the version.
  # uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      uses: aquasecurity/trivy-action@v0.36.0
      with:
    # Scan type to use for scanning vulnerability
        image-ref: leonardosartorello/seguranca_docker:${{ github.run_number }}
        
        exit-code: 1
  
        severity: HIGH,CRITICAL
        
        format: table
       
